# Syncrodes CI/CD Pipeline
#
# This workflow validates every push to main and every pull request targeting main.
# It installs dependencies, checks code quality, builds both frontend and backend,
# and builds Docker images — ensuring the project is always deployable.
#
# Automatic Deployments:
#   - Vercel (Frontend): Connected directly to GitHub — deploys on push to main.
#   - Railway (Backend): Connected directly to GitHub — deploys on push to main.
#   This CI workflow only validates; deployments happen via GitHub integrations.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch (PR or push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node.js version — match frontend/.nvmrc or package.json engines
  NODE_VERSION: "20"
  # Python version — match backend runtime
  PYTHON_VERSION: "3.11"
  # Docker image tags
  BACKEND_IMAGE: syncrodes-backend
  FRONTEND_IMAGE: syncrodes-frontend

jobs:
  ci:
    name: "Validate & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # These env vars are required at build time by Next.js (NEXT_PUBLIC_*).
    # Dummy values are fine — the build only needs them to compile; real values
    # are injected at runtime by Vercel / Railway / Docker Compose.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Setup Python ─────────────────────────────────────────
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # ── 4. Install Frontend Dependencies ────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── 5. Install Backend Dependencies ─────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Frontend Lint (only runs if ESLint is configured) ────
      - name: Lint frontend
        working-directory: frontend
        if: |
          hashFiles('frontend/eslint.config.mjs', 'frontend/eslint.config.js', 'frontend/.eslintrc.json') != ''
        run: npx next lint --no-cache

      # ── 7. Build Frontend ───────────────────────────────────────
      - name: Build Next.js frontend
        working-directory: frontend
        run: npm run build
        env:
          # Provide build-time env vars for NEXT_PUBLIC_* substitutions
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}

      # ── 8. Backend Syntax & Structure Check ─────────────────────
      # We use py_compile to check syntax without triggering:
      #   - sentence-transformers model downloads (~500MB)
      #   - Env-var-dependent imports (GROQ_API_KEY, SUPABASE_URL, etc.)
      - name: Verify backend syntax
        working-directory: backend
        run: |
          find . -name '*.py' -exec python -m py_compile {} \;
          echo "OK: All Python files have valid syntax."

      # ── 9. Backend Tests (skip gracefully if not present) ──────
      # Runs BEFORE Docker builds to fail fast if tests fail.
      - name: Run backend tests (if present)
        working-directory: backend
        run: |
          TEST_FILES=$(ls scripts/test_*.py 2>/dev/null || true)
          if [ -n "$TEST_FILES" ]; then
            echo "Test scripts found, but they require Supabase/GROQ credentials."
            echo "Skipping integration tests in CI — they require external services."
            echo "Test files present: $TEST_FILES"
          else
            echo "No backend test scripts found — skipping."
          fi

      # ── 10. Build Backend Docker Image ──────────────────────────
      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --tag ${{ env.BACKEND_IMAGE }}:latest \
            backend/

      # ── 11. Build Frontend Docker Image ─────────────────────────
      # Pass NEXT_PUBLIC_* build-args so the Docker-level npm run build
      # can inline these values (required in CI since .env.local is gitignored).
      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} \
            --file frontend/Dockerfile \
            --tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --tag ${{ env.FRONTEND_IMAGE }}:latest \
            frontend/

      # ── 12. Verify Docker Images ────────────────────────────────
      - name: Verify Docker images exist
        run: |
          docker images --filter=reference='${{ env.BACKEND_IMAGE }}' --format '{{.Repository}}:{{.Tag}}'
          docker images --filter=reference='${{ env.FRONTEND_IMAGE }}' --format '{{.Repository}}:{{.Tag}}'
          echo "Both Docker images built successfully."
